services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subledger
      POSTGRES_PASSWORD: subledger
      POSTGRES_DB: subledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subledger"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://subledger:subledger@db:5432/subledger
      INVOICE_DUE_DAYS: "7"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
